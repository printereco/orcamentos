<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Financeiro — Printer & Co.</title>
  <link rel="stylesheet" href="css/styles.css">
  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/menu.js"></script>
  <style>
    .periodo-bar {
      display:flex; gap:10px; align-items:center; flex-wrap:wrap; margin-bottom:20px;
    }
    .periodo-bar label { font-size:0.82rem; font-weight:600; color:#555; }
    .periodo-bar input, .periodo-bar select {
      padding:8px 12px; border:1px solid #ddd; border-radius:8px;
      font-size:0.88rem; font-family:inherit; outline:none;
    }
    .periodo-bar input:focus, .periodo-bar select:focus { border-color:#E91E8C; }

    .grafico-bar-container {
      background:#fff;
      border-radius:10px;
      box-shadow:0 2px 8px rgba(0,0,0,0.10);
      padding:24px;
      margin-bottom:24px;
    }
    .grafico-titulo {
      font-size:0.9rem;
      font-weight:700;
      color:#1A1A1A;
      margin-bottom:16px;
    }
    .bar-item {
      display:flex;
      align-items:center;
      gap:10px;
      margin-bottom:10px;
    }
    .bar-label { font-size:0.8rem; color:#555; width:80px; text-align:right; white-space:nowrap; }
    .bar-track { flex:1; background:#F5F5F5; border-radius:6px; height:20px; overflow:hidden; }
    .bar-fill  { height:100%; border-radius:6px; transition:width 0.6s ease; }
    .bar-valor { font-size:0.8rem; font-weight:700; color:#1A1A1A; width:100px; text-align:left; }

    .top-clientes { margin-top:4px; }
    .top-item {
      display:flex; justify-content:space-between; align-items:center;
      padding:10px 0; border-bottom:1px solid #F0F0F0; font-size:0.88rem;
    }
    .top-item:last-child { border-bottom:none; }
    .top-rank { color:#E91E8C; font-weight:800; width:24px; }
  </style>
</head>
<body>

<div id="sidebar"></div>
<div id="sidebar-overlay"></div>

<div id="conteudo">
  <div class="pagina-header">
    <div style="display:flex;align-items:center;gap:12px;">
      <button id="btn-menu-mobile">☰</button>
      <h1>💰 Financeiro</h1>
    </div>
  </div>

  <div class="pagina-corpo">

    <!-- Filtro de período -->
    <div class="periodo-bar">
      <label>De:</label>
      <input type="date" id="data-inicio" onchange="carregar()" />
      <label>Até:</label>
      <input type="date" id="data-fim" onchange="carregar()" />
      <select id="filtro-rapido" onchange="aplicarPeriodoRapido()">
        <option value="">Período personalizado</option>
        <option value="mes">Este mês</option>
        <option value="trimestre">Este trimestre</option>
        <option value="ano">Este ano</option>
        <option value="todos">Todos</option>
      </select>
    </div>

    <!-- KPIs -->
    <div class="kpi-grid" id="kpi-grid">
      <div class="kpi-card rosa">
        <div class="kpi-label">Total Orçado</div>
        <div class="kpi-valor" id="kpi-total">—</div>
        <div class="kpi-sub" id="kpi-total-qtd">— orçamentos</div>
      </div>
      <div class="kpi-card verde">
        <div class="kpi-label">Pago / Recebido</div>
        <div class="kpi-valor" id="kpi-pago">—</div>
        <div class="kpi-sub" id="kpi-pago-qtd">— orçamentos</div>
      </div>
      <div class="kpi-card amarelo">
        <div class="kpi-label">Pendente</div>
        <div class="kpi-valor" id="kpi-pendente">—</div>
        <div class="kpi-sub" id="kpi-pendente-qtd">— orçamentos</div>
      </div>
      <div class="kpi-card cinza">
        <div class="kpi-label">Cancelado</div>
        <div class="kpi-valor" id="kpi-cancelado">—</div>
        <div class="kpi-sub" id="kpi-cancelado-qtd">— orçamentos</div>
      </div>
    </div>

    <!-- Gráfico de status -->
    <div class="grafico-bar-container">
      <div class="grafico-titulo">Distribuição por Status</div>
      <div id="grafico-status">
        <div class="carregando"><div class="spinner"></div></div>
      </div>
    </div>

    <!-- Top clientes e tabela -->
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:20px;">

      <div class="card">
        <div class="card-titulo">🏆 Top 5 Clientes</div>
        <div id="top-clientes" class="top-clientes">
          <div class="carregando"><div class="spinner"></div></div>
        </div>
      </div>

      <div class="card">
        <div class="card-titulo">📅 Orçamentos do Período</div>
        <div id="resumo-periodo" style="font-size:0.88rem;color:#555;">
          <div class="carregando"><div class="spinner"></div></div>
        </div>
      </div>

    </div>

  </div>
</div>

<div id="toast-container"></div>

<script>
const sessao = verificarSessao();
let orcamentos = [];

document.addEventListener('DOMContentLoaded', () => {
  renderizarMenu('financeiro.html');
  // Padrão: mês atual
  document.getElementById('filtro-rapido').value = 'mes';
  aplicarPeriodoRapido();
});

function aplicarPeriodoRapido() {
  const val = document.getElementById('filtro-rapido').value;
  const hoje = new Date();
  let inicio, fim;

  if (val === 'mes') {
    inicio = new Date(hoje.getFullYear(), hoje.getMonth(), 1);
    fim    = new Date(hoje.getFullYear(), hoje.getMonth() + 1, 0);
  } else if (val === 'trimestre') {
    const q = Math.floor(hoje.getMonth() / 3);
    inicio  = new Date(hoje.getFullYear(), q * 3, 1);
    fim     = new Date(hoje.getFullYear(), q * 3 + 3, 0);
  } else if (val === 'ano') {
    inicio = new Date(hoje.getFullYear(), 0, 1);
    fim    = new Date(hoje.getFullYear(), 11, 31);
  } else if (val === 'todos') {
    document.getElementById('data-inicio').value = '';
    document.getElementById('data-fim').value    = '';
    carregar();
    return;
  } else {
    return;
  }

  document.getElementById('data-inicio').value = inicio.toISOString().split('T')[0];
  document.getElementById('data-fim').value    = fim.toISOString().split('T')[0];
  carregar();
}

async function carregar() {
  const inicio = document.getElementById('data-inicio').value;
  const fim    = document.getElementById('data-fim').value;

  let filtro = 'select=*';
  if (inicio) filtro += `&criado_em=gte.${inicio}`;
  if (fim)    filtro += `&criado_em=lte.${fim}T23:59:59`;
  filtro += '&order=id.desc';

  try {
    orcamentos = await supaGet('orcamentos', filtro);
    calcularKPIs();
    renderizarGrafico();
    renderizarTopClientes();
    renderizarResumoPeriodo();
  } catch (e) {
    toast('Erro ao carregar dados.', 'erro');
  }
}

function calcularKPIs() {
  const total     = orcamentos.reduce((s,o) => s + (o.total||0), 0);
  const pagos     = orcamentos.filter(o => o.status === 'pago');
  const pendentes = orcamentos.filter(o => o.status === 'pendente' || !o.status);
  const cancelados= orcamentos.filter(o => o.status === 'cancelado');

  document.getElementById('kpi-total').textContent      = formatarMoeda(total);
  document.getElementById('kpi-total-qtd').textContent  = `${orcamentos.length} orçamentos`;

  document.getElementById('kpi-pago').textContent       = formatarMoeda(pagos.reduce((s,o)=>s+(o.total||0),0));
  document.getElementById('kpi-pago-qtd').textContent   = `${pagos.length} orçamentos`;

  document.getElementById('kpi-pendente').textContent   = formatarMoeda(pendentes.reduce((s,o)=>s+(o.total||0),0));
  document.getElementById('kpi-pendente-qtd').textContent= `${pendentes.length} orçamentos`;

  document.getElementById('kpi-cancelado').textContent  = formatarMoeda(cancelados.reduce((s,o)=>s+(o.total||0),0));
  document.getElementById('kpi-cancelado-qtd').textContent=`${cancelados.length} orçamentos`;
}

function renderizarGrafico() {
  const total     = orcamentos.reduce((s,o) => s + (o.total||0), 0) || 1;
  const grupos    = {
    pago:      { label:'Pago',      cor:'#2E7D32', valor:0 },
    pendente:  { label:'Pendente',  cor:'#F57F17', valor:0 },
    cancelado: { label:'Cancelado', cor:'#C62828', valor:0 }
  };

  orcamentos.forEach(o => {
    const s = o.status || 'pendente';
    if (grupos[s]) grupos[s].valor += (o.total||0);
  });

  const html = Object.values(grupos).map(g => `
    <div class="bar-item">
      <div class="bar-label">${g.label}</div>
      <div class="bar-track">
        <div class="bar-fill" style="width:${(g.valor/total*100).toFixed(1)}%;background:${g.cor}"></div>
      </div>
      <div class="bar-valor">${formatarMoeda(g.valor)}</div>
    </div>
  `).join('');

  document.getElementById('grafico-status').innerHTML = html || '<p style="color:#888;font-size:0.85rem">Sem dados no período.</p>';
}

function renderizarTopClientes() {
  const mapa = {};
  orcamentos.filter(o => o.status === 'pago').forEach(o => {
    const nome = o.cliente || 'Sem nome';
    mapa[nome] = (mapa[nome] || 0) + (o.total || 0);
  });

  const top = Object.entries(mapa).sort((a,b) => b[1]-a[1]).slice(0,5);
  const el  = document.getElementById('top-clientes');

  if (!top.length) {
    el.innerHTML = '<p style="color:#888;font-size:0.85rem;padding:12px 0">Nenhum orçamento pago no período.</p>';
    return;
  }

  el.innerHTML = top.map(([nome, val], i) => `
    <div class="top-item">
      <div style="display:flex;align-items:center;gap:8px;">
        <span class="top-rank">${i+1}°</span>
        <span>${nome}</span>
      </div>
      <strong>${formatarMoeda(val)}</strong>
    </div>
  `).join('');
}

function renderizarResumoPeriodo() {
  const el = document.getElementById('resumo-periodo');
  if (!orcamentos.length) {
    el.innerHTML = '<p style="color:#888;font-size:0.85rem">Nenhum orçamento no período selecionado.</p>';
    return;
  }

  const recentes = orcamentos.slice(0, 8);
  el.innerHTML = recentes.map(o => `
    <div style="display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid #F0F0F0;">
      <div>
        <div style="font-weight:600;font-size:0.85rem">${o.cliente||'—'}</div>
        <div style="font-size:0.75rem;color:#888">${formatarData(o.data)}</div>
      </div>
      <div style="text-align:right">
        <div style="font-weight:700;font-size:0.88rem">${formatarMoeda(o.total)}</div>
        <span class="badge badge-${o.status||'pendente'}">${(o.status||'pendente').toUpperCase()}</span>
      </div>
    </div>
  `).join('');
}
</script>
</body>
</html>
