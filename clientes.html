<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Clientes — Printer & Co.</title>
  <link rel="stylesheet" href="css/styles.css">
  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/menu.js"></script>
</head>
<body>

<div id="sidebar"></div>
<div id="sidebar-overlay"></div>

<div id="conteudo">
  <div class="pagina-header">
    <div style="display:flex;align-items:center;gap:12px;">
      <button id="btn-menu-mobile">☰</button>
      <h1>👥 Clientes</h1>
    </div>
    <button class="btn btn-primario" onclick="abrirModalNovo()">+ Novo Cliente</button>
  </div>

  <div class="pagina-corpo">

    <!-- Busca -->
    <div class="filtros-bar">
      <input type="text" id="filtro-busca" placeholder="🔍 Buscar por nome ou telefone..." oninput="filtrarLista()" style="flex:1;min-width:200px;" />
    </div>

    <!-- Tabela -->
    <div class="tabela-container">
      <table>
        <thead>
          <tr>
            <th>Nome</th>
            <th>Telefone</th>
            <th>Email</th>
            <th>CNPJ/CPF</th>
            <th>Cidade</th>
            <th>Ações</th>
          </tr>
        </thead>
        <tbody id="lista-clientes">
          <tr><td colspan="6"><div class="carregando"><div class="spinner"></div></div></td></tr>
        </tbody>
      </table>
    </div>

  </div>
</div>

<!-- Modal: Novo/Editar Cliente -->
<div class="modal-overlay" id="modal-cliente">
  <div class="modal">
    <div class="modal-cabecalho">
      <h2 id="modal-titulo">Novo Cliente</h2>
      <button class="modal-fechar" onclick="fecharModal('modal-cliente')">✕</button>
    </div>
    <div class="modal-corpo">
      <input type="hidden" id="cliente-id" />
      <div class="form-grupo">
        <label>Nome *</label>
        <input type="text" id="campo-nome" placeholder="Nome completo ou razão social" />
      </div>
      <div class="form-linha form-linha-2">
        <div class="form-grupo">
          <label>Telefone</label>
          <input type="tel" id="campo-telefone" placeholder="(00) 00000-0000" />
        </div>
        <div class="form-grupo">
          <label>Email</label>
          <input type="email" id="campo-email" placeholder="email@exemplo.com" />
        </div>
      </div>
      <div class="form-linha form-linha-2">
        <div class="form-grupo">
          <label>CNPJ / CPF</label>
          <input type="text" id="campo-documento" placeholder="00.000.000/0000-00" />
        </div>
        <div class="form-grupo">
          <label>Cidade</label>
          <input type="text" id="campo-cidade" placeholder="Cidade — UF" />
        </div>
      </div>
      <div class="form-grupo">
        <label>Endereço</label>
        <input type="text" id="campo-endereco" placeholder="Rua, número, bairro" />
      </div>
      <div class="form-grupo">
        <label>Observações</label>
        <textarea id="campo-obs" rows="2" placeholder="Anotações sobre o cliente..."></textarea>
      </div>
    </div>
    <div class="modal-rodape">
      <button class="btn btn-secundario" onclick="fecharModal('modal-cliente')">Cancelar</button>
      <button class="btn btn-primario" onclick="salvarCliente()">💾 Salvar</button>
    </div>
  </div>
</div>

<!-- Modal: Confirmar exclusão -->
<div class="modal-overlay" id="modal-confirmar">
  <div class="modal">
    <div class="modal-cabecalho">
      <h2>Confirmar Exclusão</h2>
      <button class="modal-fechar" onclick="fecharModal('modal-confirmar')">✕</button>
    </div>
    <div class="modal-corpo">
      <p>Tem certeza que deseja excluir o cliente <strong id="nome-excluir"></strong>?</p>
      <p style="color:#C62828;font-size:0.85rem;margin-top:8px;">Esta ação não pode ser desfeita.</p>
    </div>
    <div class="modal-rodape">
      <button class="btn btn-secundario" onclick="fecharModal('modal-confirmar')">Cancelar</button>
      <button class="btn btn-perigo" onclick="confirmarExclusao()">🗑️ Excluir</button>
    </div>
  </div>
</div>

<div id="toast-container"></div>

<script>
const sessao = verificarSessao();
let clientes = [];
let excluindoId = null;

document.addEventListener('DOMContentLoaded', async () => {
  renderizarMenu('clientes.html');
  await carregarClientes();
});

async function carregarClientes() {
  try {
    clientes = await supaGet('clientes', 'select=*&order=nome');
    renderizarLista(clientes);
  } catch {
    document.getElementById('lista-clientes').innerHTML =
      `<tr><td colspan="6" style="color:#C62828;padding:20px">Erro ao carregar clientes.</td></tr>`;
  }
}

function filtrarLista() {
  const busca = document.getElementById('filtro-busca').value.toLowerCase();
  const filtrados = clientes.filter(c =>
    (c.nome||'').toLowerCase().includes(busca) ||
    (c.telefone||'').includes(busca)
  );
  renderizarLista(filtrados);
}

function renderizarLista(lista) {
  const tbody = document.getElementById('lista-clientes');
  if (!lista.length) {
    tbody.innerHTML = `<tr><td colspan="6"><div class="estado-vazio"><div class="icone-vazio">👥</div><p>Nenhum cliente cadastrado.</p></div></td></tr>`;
    return;
  }
  tbody.innerHTML = lista.map(c => `
    <tr>
      <td><strong>${c.nome}</strong></td>
      <td>${c.telefone || '—'}</td>
      <td>${c.email    || '—'}</td>
      <td>${c.documento|| '—'}</td>
      <td>${c.cidade   || '—'}</td>
      <td style="display:flex;gap:6px;">
        <button class="btn btn-secundario btn-sm" onclick="editarCliente(${c.id})">✏️ Editar</button>
        <button class="btn btn-perigo btn-sm" onclick="pedirExclusao(${c.id},'${(c.nome||'').replace(/'/g,"\\'")}')">🗑️</button>
      </td>
    </tr>
  `).join('');
}

function abrirModalNovo() {
  document.getElementById('modal-titulo').textContent = 'Novo Cliente';
  document.getElementById('cliente-id').value   = '';
  document.getElementById('campo-nome').value   = '';
  document.getElementById('campo-telefone').value= '';
  document.getElementById('campo-email').value  = '';
  document.getElementById('campo-documento').value= '';
  document.getElementById('campo-cidade').value = '';
  document.getElementById('campo-endereco').value= '';
  document.getElementById('campo-obs').value    = '';
  abrirModal('modal-cliente');
}

function editarCliente(id) {
  const c = clientes.find(x => x.id === id);
  if (!c) return;
  document.getElementById('modal-titulo').textContent  = 'Editar Cliente';
  document.getElementById('cliente-id').value    = c.id;
  document.getElementById('campo-nome').value    = c.nome      || '';
  document.getElementById('campo-telefone').value= c.telefone  || '';
  document.getElementById('campo-email').value   = c.email     || '';
  document.getElementById('campo-documento').value= c.documento|| '';
  document.getElementById('campo-cidade').value  = c.cidade    || '';
  document.getElementById('campo-endereco').value= c.endereco  || '';
  document.getElementById('campo-obs').value     = c.observacoes|| '';
  abrirModal('modal-cliente');
}

async function salvarCliente() {
  const nome = document.getElementById('campo-nome').value.trim();
  if (!nome) { toast('Informe o nome do cliente.', 'erro'); return; }

  const dados = {
    nome,
    telefone:    document.getElementById('campo-telefone').value.trim(),
    email:       document.getElementById('campo-email').value.trim(),
    documento:   document.getElementById('campo-documento').value.trim(),
    cidade:      document.getElementById('campo-cidade').value.trim(),
    endereco:    document.getElementById('campo-endereco').value.trim(),
    observacoes: document.getElementById('campo-obs').value.trim()
  };

  const id = document.getElementById('cliente-id').value;

  try {
    if (id) {
      await supaPatch('clientes', `id=eq.${id}`, dados);
      toast('Cliente atualizado!', 'sucesso');
    } else {
      await supaPost('clientes', dados);
      toast('Cliente cadastrado!', 'sucesso');
    }
    fecharModal('modal-cliente');
    await carregarClientes();
  } catch (e) {
    toast('Erro ao salvar: ' + e.message, 'erro');
  }
}

function pedirExclusao(id, nome) {
  excluindoId = id;
  document.getElementById('nome-excluir').textContent = nome;
  abrirModal('modal-confirmar');
}

async function confirmarExclusao() {
  if (!excluindoId) return;
  try {
    await supaDelete('clientes', `id=eq.${excluindoId}`);
    toast('Cliente excluído.', 'sucesso');
    fecharModal('modal-confirmar');
    await carregarClientes();
  } catch { toast('Erro ao excluir.', 'erro'); }
  excluindoId = null;
}
</script>
</body>
</html>
